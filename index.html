<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prediction markets benchmark — October 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF0EA; --card:#F7F8F4; --ink:#17202E; --muted:#596270; --line:#CDD2C7; --line-soft:#DFE3DA;
  --yes:#2E6B57; --yes-soft:#D6E6DE; --amber:#9A720C; --amber-soft:#F1E5BF; --rose:#A63D4F; --rose-soft:#F1D9DD;
  --slate:#6C7480; --slate-soft:#E1E4E6; --violet:#5A4E8C; --violet-soft:#E2DFF0;
  --seg1:#17202E; --seg2:#2E6B57; --seg3:#7FA898; --seg4:#B98A12;
  --focus:#3B6FD9;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#131921; --card:#1A212B; --ink:#E6E9E2; --muted:#9CA5B0; --line:#2D3642; --line-soft:#232B36;
    --yes:#62B697; --yes-soft:#1E3A31; --amber:#E2B84E; --amber-soft:#3A3018; --rose:#E28393; --rose-soft:#3E2229;
    --slate:#9AA2AD; --slate-soft:#28303A; --violet:#AFA4E6; --violet-soft:#2B2742;
    --seg1:#E6E9E2; --seg2:#62B697; --seg3:#3E7563; --seg4:#E2B84E; --focus:#7FA6FF;
  }
}
:root[data-theme="dark"]{
  --paper:#131921; --card:#1A212B; --ink:#E6E9E2; --muted:#9CA5B0; --line:#2D3642; --line-soft:#232B36;
  --yes:#62B697; --yes-soft:#1E3A31; --amber:#E2B84E; --amber-soft:#3A3018; --rose:#E28393; --rose-soft:#3E2229;
  --slate:#9AA2AD; --slate-soft:#28303A; --violet:#AFA4E6; --violet-soft:#2B2742;
  --seg1:#E6E9E2; --seg2:#62B697; --seg3:#3E7563; --seg4:#E2B84E; --focus:#7FA6FF;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Schibsted Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.wrap{max-width:1360px;margin:0 auto;padding:40px 28px 64px}
header.top{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:48px;align-items:end;padding-bottom:36px;border-bottom:2px solid var(--ink)}
h1{font-size:clamp(34px,4.6vw,60px);line-height:1.02;letter-spacing:-0.025em;font-weight:800;margin:0 0 18px;max-width:14ch}
.lede{color:var(--muted);max-width:58ch;margin:0;font-size:17px}
.snap{font-size:14px;color:var(--muted);margin-top:14px}
.share h2{font-size:15px;font-weight:600;margin:0 0 12px}
.bar{display:flex;height:64px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.bar span{display:flex;align-items:flex-end;padding:0 10px 8px;font-weight:700;font-size:20px;color:var(--paper);white-space:nowrap;overflow:hidden;transform-origin:left;animation:grow .9s cubic-bezier(.2,.7,.2,1) both}
.bar span:nth-child(1){background:var(--seg1)}
.bar span:nth-child(2){background:var(--seg2);animation-delay:.08s}
.bar span:nth-child(3){background:var(--seg3);animation-delay:.16s;color:var(--ink)}
.bar span:nth-child(4){background:var(--seg4);animation-delay:.24s;padding:0}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){.bar span{animation:none}}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin:10px 0 0;padding:0;list-style:none;font-size:14px}
.legend li{display:flex;align-items:center;gap:7px}
.legend i{width:11px;height:11px;border-radius:2px;display:inline-block}
.caption{font-size:13px;color:var(--muted);margin:8px 0 0}
.valos{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;margin-top:22px;border-top:1px solid var(--line)}
.valos div{padding:10px 10px 0 0}
.valos b{display:block;font-size:20px;letter-spacing:-0.01em}
.valos small{display:block;color:var(--muted);font-size:12.5px;line-height:1.35}

section.reading{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px;padding:30px 0;border-bottom:1px solid var(--line)}
section.reading h3{font-size:16px;margin:0 0 6px;line-height:1.3}
section.reading p{margin:0;color:var(--muted);font-size:14.5px}

.controls{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding:18px 0 14px;border-bottom:1px solid var(--line)}
.cats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.cat{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px;padding:7px 12px;border-radius:999px;cursor:pointer;display:flex;gap:8px;align-items:center}
.cat em{font-style:normal;color:var(--muted);font-size:12.5px}
.cat[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.cat[aria-pressed="true"] em{color:inherit;opacity:.75}
.row2{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{flex:1 1 260px;min-width:200px;position:relative}
.search input{width:100%;font:inherit;font-size:15px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
select{font:inherit;font-size:14px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.count{font-size:14px;color:var(--muted);margin-left:auto}
.reset{font:inherit;font-size:14px;background:none;border:none;color:var(--ink);text-decoration:underline;cursor:pointer;padding:6px}

.tablebox{overflow-x:auto;margin-top:16px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:1500px;font-size:14px}
thead th{position:sticky;top:0;background:var(--card);text-align:left;font-weight:600;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line);padding:0;white-space:nowrap}
thead th button{all:unset;cursor:pointer;display:flex;gap:6px;align-items:center;padding:12px 12px;width:100%;box-sizing:border-box}
thead th button:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
thead th .arr{opacity:.35;font-size:11px}
thead th[aria-sort="ascending"] .arr,thead th[aria-sort="descending"] .arr{opacity:1;color:var(--ink)}
thead th span.nob{display:block;padding:12px}
tbody td{padding:13px 12px;border-bottom:1px solid var(--line-soft);vertical-align:top}
tbody tr.main{cursor:pointer}
tbody tr.main:hover td{background:color-mix(in srgb,var(--paper) 55%,var(--card))}
td.name,th.name{position:sticky;left:0;background:var(--card);z-index:1;min-width:210px;max-width:230px;box-shadow:1px 0 0 var(--line-soft)}
thead th.name{z-index:3}
td.name strong{display:block;font-size:15px;line-height:1.25}
td.name .cattag{display:block;color:var(--muted);font-size:12.5px;margin-top:3px}
td.name .tog{display:inline-block;margin-top:6px;font-size:12.5px;color:var(--muted);text-decoration:underline;text-underline-offset:2px;background:none;border:none;padding:0;cursor:pointer;font-family:inherit}
td.w-diff{min-width:300px;max-width:340px}
td.w-mid{min-width:190px;max-width:230px}
td.w-num{min-width:200px;max-width:240px}
td.creator{min-width:170px;max-width:200px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 9px 3px 7px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-live{background:var(--yes-soft);color:var(--yes)}
.s-partial{background:var(--amber-soft);color:var(--amber)}
.s-announced{background:var(--rose-soft);color:var(--rose)}
.s-pending{background:var(--violet-soft);color:var(--violet)}
.s-rumor{background:transparent;color:var(--rose);box-shadow:inset 0 0 0 1px var(--rose)}
.s-closed{background:var(--slate-soft);color:var(--slate)}
.snote{display:block;color:var(--muted);font-size:12.5px;margin-top:5px;line-height:1.35;max-width:170px}
.weight{display:flex;gap:3px;margin-bottom:5px}
.weight i{width:12px;height:6px;border-radius:2px;background:var(--line)}
.weight i.on{background:var(--ink)}
.wlabel{font-size:12.5px;color:var(--muted)}
tr.detail td{background:color-mix(in srgb,var(--paper) 40%,var(--card));padding:14px 16px 18px}
tr.detail .dbox{position:sticky;left:16px;max-width:min(880px,calc(100vw - 80px))}
tr.detail p{margin:0 0 6px;font-size:14.5px}
tr.detail a{font-size:13.5px}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.empty button{font:inherit;color:var(--ink);background:none;border:none;text-decoration:underline;cursor:pointer}
.nd{color:var(--muted)}

footer{margin-top:40px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:40px;font-size:14px;color:var(--muted)}
footer h2{font-size:15px;color:var(--ink);margin:0 0 10px}
footer ul{margin:0;padding-left:18px}
footer li{margin-bottom:5px}
footer p{margin:0 0 10px}
.legendstatus{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}

@media (max-width:980px){
  header.top{grid-template-columns:1fr;gap:28px}
  section.reading{grid-template-columns:repeat(2,minmax(0,1fr))}
  footer{grid-template-columns:1fr}
}
@media (max-width:600px){
  .wrap{padding:24px 16px 48px}
  section.reading{grid-template-columns:1fr;gap:18px}
  .valos{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bar{height:52px}
  .bar span{font-size:16px}
  .controls{position:static}
  .count{margin-left:0;width:100%}
}
.topbar{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-bottom:18px}
.topbar label{font-size:13.5px;color:var(--muted)}
.topbar select{font-weight:600}
</style>
</head>
<body>
<div class="wrap">

<div class="topbar">
  <label for="lang" data-i18n="langLabel">Language</label>
  <select id="lang">
    <option value="en">English</option>
    <option value="fr">Français</option>
  </select>
</div>

<header class="top">
  <div>
    <h1 data-i18n="h1">Who runs prediction markets in October 2026</h1>
    <p class="lede" data-i18n="lede"></p>
    <p class="snap" data-i18n="snap"></p>
  </div>
  <div class="share">
    <h2 data-i18n="shareTitle"></h2>
    <div class="bar" role="img" id="bar">
      <span style="flex:80" class="p80"></span><span style="flex:12" class="p12"></span><span style="flex:6" class="p6"></span><span style="flex:2"></span>
    </div>
    <ul class="legend">
      <li><i style="background:var(--seg1)"></i>Kalshi</li>
      <li><i style="background:var(--seg2)"></i>Polymarket US</li>
      <li><i style="background:var(--seg3)"></i>Polymarket International</li>
      <li><i style="background:var(--seg4)"></i><span class="novig"></span></li>
    </ul>
    <p class="caption" data-i18n="caption"></p>
    <div class="valos" id="valos"></div>
  </div>
</header>

<section class="reading" id="reading"></section>

<div class="controls">
  <div class="cats" id="cats" role="group"></div>
  <div class="row2">
    <div class="search"><input id="q" type="search"></div>
    <select id="fstatus"></select>
    <select id="freg"></select>
    <button class="reset" id="reset" type="button" data-i18n="reset"></button>
    <span class="count" id="count" aria-live="polite"></span>
  </div>
</div>

<div class="tablebox">
<table id="tbl">
  <thead>
    <tr>
      <th class="name" data-k="name"><button type="button"><span data-i18n="thName"></span> <span class="arr">▲▼</span></button></th>

      <th data-k="weight"><button type="button"><span data-i18n="thWeight"></span> <span class="arr">▲▼</span></button></th>
      <th data-k="creator"><button type="button"><span data-i18n="thCreator"></span> <span class="arr">▲▼</span></button></th>
      <th><span class="nob" data-i18n="thDiff"></span></th>
      <th data-k="reg"><button type="button"><span data-i18n="thReg"></span> <span class="arr">▲▼</span></button></th>
      <th data-k="chain"><button type="button"><span data-i18n="thChain"></span> <span class="arr">▲▼</span></button></th>
      <th><span class="nob" data-i18n="thModel"></span></th>
      <th><span class="nob" data-i18n="thVol"></span></th>
      <th><span class="nob" data-i18n="thFund"></span></th>
    </tr>
  </thead>
  <tbody id="tb"></tbody>
</table>
</div>

<footer>
  <div>
    <h2 data-i18n="howTitle"></h2>
    <p data-i18n="how1"></p>
    <p data-i18n="how2"></p>
    <div class="legendstatus" id="legendstatus"></div>
  </div>
  <div>
    <h2 data-i18n="srcTitle"></h2>
    <ul id="sources"></ul>
  </div>
</footer>
</div>

  fs.value = state.status;
  const fr = document.getElementById("freg"); fr.setAttribute("aria-label", t.regLabel);
  fr.innerHTML = `<option value="">${esc(t.regAll)}</option>` + Object.entries(t.regOpts).map(([k,v]) => `<option value="${k}">${esc(v)}</option>`).join("");
  fr.value = state.reg;
  document.getElementById("legendstatus").innerHTML = Object.entries(t.status).map(([k,v]) => `<span class="pill ${STATUS_META[k][0]}">${esc(v)}</span>`).join("");
  document.getElementById("sources").innerHTML = t.sources.map((s,i) => `<li><a href="${SOURCE_URLS[i]}" target="_blank" rel="noopener">${esc(s)}</a></li>`).join("");
}

function renderCats(){
  const t = T(), box = document.getElementById("cats"), counts = {};
  D.forEach(r => counts[r.c] = (counts[r.c]||0)+1);
  const items = [["", t.all, D.length], ...Object.entries(t.cats).map(([k,v]) => [k, v, counts[k]||0])];
  box.innerHTML = items.map(([k,l,n]) => `<button type="button" class="cat" data-c="${k}" aria-pressed="${state.cat===k}">${esc(l)} <em>${n}</em></button>`).join("");
  box.querySelectorAll(".cat").forEach(b => b.addEventListener("click", () => { state.cat = b.dataset.c; renderCats(); render(); }));
}

function val(r,k){
  if(k==="status") return STATUS_META[r.s][1];
  if(k==="weight") return r.w;
  const map = {name:"n",creator:"cr",reg:"r",chain:"ch"};
  return norm(L(r,map[k]));
}

function render(){
  const t = T(), q = norm(state.q);
  let rows = D.filter(r =>
    (!state.cat || r.c===state.cat) && (!state.status || r.s===state.status) && (!state.reg || r.rg===state.reg) &&
    (!q || norm(FIELDS.map(k => L(r,k)).concat([t.cats[r.c], r.n]).join(" ")).includes(q))
  );
  rows.sort((a,b) => {
    const va = val(a,state.sortK), vb = val(b,state.sortK);
    if(va<vb) return -1*state.sortDir; if(va>vb) return state.sortDir;
    return b.w - a.w || norm(a.n).localeCompare(norm(b.n));
  });
  document.querySelectorAll("thead th[data-k]").forEach(th => {
    const on = th.dataset.k===state.sortK;
    th.setAttribute("aria-sort", on ? (state.sortDir===1?"ascending":"descending") : "none");
    th.querySelector(".arr").textContent = on ? (state.sortDir===1?"▲":"▼") : "▲▼";
  });
  document.getElementById("count").textContent = t.count(rows.length, D.length);
  const tb = document.getElementById("tb");
  if(!rows.length){
    tb.innerHTML = `<tr><td colspan="10" class="empty">${esc(t.empty)} <button type="button" id="clr">${esc(t.clear)}</button></td></tr>`;
    document.getElementById("clr").addEventListener("click", resetAll);
    return;
  }
  const blank = new Set(["n.d.","n/a","—",""]);
  const cell = v => blank.has(v ?? "") ? `<span class="nd">${esc(v||"—")}</span>` : esc(v);
  tb.innerHTML = rows.map(r => {
    const id = ID(r), open = state.open.has(id), name = L(r,"n"), sn = L(r,"sn"), x = L(r,"x");
    const bars = [1,2,3,4,5].map(i => `<i class="${i<=r.w?"on":""}"></i>`).join("");
    let html = `<tr class="main" data-id="${id}">
      <td class="name"><strong>${esc(name)}</strong><span class="cattag">${esc(t.cats[r.c])}</span>
        <button type="button" class="tog" aria-expanded="${open}" aria-controls="d-${id}">${open?t.hide:t.show}</button></td>
      <td><span class="pill ${STATUS_META[r.s][0]}">${esc(t.status[r.s])}</span>${sn?`<span class="snote">${esc(sn)}</span>`:""}</td>
      <td><div class="weight" aria-hidden="true">${bars}</div><span class="wlabel">${esc(t.weight[r.w])}</span></td>
      <td class="creator">${esc(L(r,"cr"))}</td>
      <td class="w-diff">${esc(L(r,"d"))}</td>
      <td class="w-mid">${esc(L(r,"r"))}</td>
      <td class="w-mid">${cell(L(r,"ch"))}</td>
      <td class="w-mid">${cell(L(r,"m"))}</td>
      <td class="w-num">${cell(L(r,"v"))}</td>
      <td class="w-num">${cell(L(r,"f"))}</td>
    </tr>`;
    if(open){
      html += `<tr class="detail" id="d-${id}"><td colspan="10"><div class="dbox">
        <p>${x?esc(x):esc(t.noMore)}</p>
        ${r.u?`<a href="${esc(r.u)}" target="_blank" rel="noopener">${esc(t.open(name))}</a>`:""}
      </div></td></tr>`;
    }
    return html;
  }).join("");
  tb.querySelectorAll("tr.main").forEach(tr => tr.addEventListener("click", e => {
    if(e.target.closest("a")) return;
    const id = tr.dataset.id;
    state.open.has(id) ? state.open.delete(id) : state.open.add(id);
    render();
  }));
}

function resetAll(){
  state.cat=""; state.status=""; state.reg=""; state.q="";
  document.getElementById("q").value=""; document.getElementById("fstatus").value=""; document.getElementById("freg").value="";
  renderCats(); render();
}
function setLang(l){
  state.lang = l;
  try{ localStorage.setItem("pm-bench-lang", l); }catch(e){}
  applyStatic(); renderCats(); render();
}

document.querySelectorAll("thead th[data-k] button").forEach(b => b.addEventListener("click", () => {
  const k = b.parentElement.dataset.k;
  if(state.sortK===k) state.sortDir *= -1; else { state.sortK=k; state.sortDir = (k==="weight") ? -1 : 1; }
  render();
}));
document.getElementById("lang").addEventListener("change", e => setLang(e.target.value));
document.getElementById("q").addEventListener("input", e => { state.q = e.target.value; render(); });
document.getElementById("fstatus").addEventListener("change", e => { state.status = e.target.value; render(); });
document.getElementById("freg").addEventListener("change", e => { state.reg = e.target.value; render(); });
document.getElementById("reset").addEventListener("click", resetAll);

applyStatic(); renderCats(); render();
</script>
</body>
</html>
