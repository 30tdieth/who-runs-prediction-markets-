<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prediction markets benchmark — October 2026</title>
<script>
(function(){var t;try{t=localStorage.getItem("pm-bench-theme")}catch(e){}
if(t!=="light"&&t!=="dark")t=window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
var d=document.documentElement;d.dataset.theme=t;d.classList.add("js")})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&display=swap" rel="stylesheet">
<style>
/* ───────── Tokens ───────── */
:root{
  color-scheme:light;
  --bg:#F5F7FA; --surface:#FFFFFF; --sunken:#ECEFF4;
  --ink:#0A0F1A; --ink-2:#3D4756; --ink-3:#657082; --ink-4:#98A1AE;
  --line:rgba(10,15,26,.085); --line-2:rgba(10,15,26,.16);
  --blue:#1B45D9; --blue-soft:rgba(27,69,217,.09);
  --green:#0A8A62; --green-ink:#07724F;
  --amber:#A8700A;
  --seg1:#1B45D9; --seg2:#0A8A62; --seg3:#8AD8BC; --seg4:#B4BBC6;
  --grid:rgba(10,15,26,.05); --hover:rgba(10,15,26,.03);
  --pop:0 1px 2px rgba(10,15,26,.05),0 10px 28px -14px rgba(10,15,26,.22);
  --focus:#1B45D9;

  --f-sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"Geist Mono",ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
  --f-serif:"Newsreader","Iowan Old Style","Palatino Linotype",Georgia,serif;

  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:72px; --s9:112px;
  --r1:2px; --r2:4px; --r3:6px;
  --ease:cubic-bezier(.16,1,.3,1);
  --gut:clamp(16px,4vw,40px);
  --cmd-h:0px;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#07090D; --surface:#0E1218; --sunken:#0B0E13;
  --ink:#ECEEF2; --ink-2:#B6BDC9; --ink-3:#8791A0; --ink-4:#5C6573;
  --line:rgba(236,238,242,.08); --line-2:rgba(236,238,242,.16);
  --blue:#6B95FF; --blue-soft:rgba(107,149,255,.13);
  --green:#37D6A0; --green-ink:#37D6A0;
  --amber:#E3B257;
  --seg1:#6B95FF; --seg2:#37D6A0; --seg3:#1D8263; --seg4:#4A5362;
  --grid:rgba(236,238,242,.04); --hover:rgba(236,238,242,.035);
  --pop:0 0 0 1px rgba(236,238,242,.1),0 14px 32px -14px rgba(0,0,0,.8);
  --focus:#8FB0FF;
}

/* ───────── Base ───────── */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--cmd-h) + 56px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-feature-settings:"ss01","cv11";
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p,ul,ol,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
svg{display:block;flex:none}
:focus{outline:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:var(--r1)}
::selection{background:var(--blue);color:#fff}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.wrap{max-width:1440px;margin:0 auto;padding:0 var(--gut)}
.num{font-variant-numeric:tabular-nums lining-nums}

/* Type roles */
.kicker{display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.kicker::before{content:"";width:6px;height:6px;background:var(--blue);flex:none}
.kicker.g::before{background:var(--green)}
.sec-title{font-size:17px;font-weight:500;letter-spacing:-.01em;line-height:1.35;color:var(--ink);max-width:62ch;margin-top:10px}
.label{font-family:var(--f-mono);font-size:10.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}

/* Signature grid, fades out under the hero */
.page{position:relative;isolation:isolate}
.page::before{content:"";position:absolute;inset:0 0 auto 0;height:640px;z-index:-1;pointer-events:none;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:64px 64px;background-position:center top;
  -webkit-mask-image:radial-gradient(120% 100% at 80% 0%,#000 0%,transparent 72%);mask-image:radial-gradient(120% 100% at 80% 0%,#000 0%,transparent 72%)}

/* ───────── Top bar ───────── */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:var(--s4);height:64px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:600;letter-spacing:-.005em;min-width:0}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mark{width:18px;height:18px;display:grid;grid-template-rows:62fr 38fr;gap:2px}
.mark i{background:var(--blue)}
.mark i+i{background:var(--green)}
.tools{display:flex;align-items:center;gap:var(--s2)}
.lang{display:flex;border:1px solid var(--line-2);border-radius:var(--r2);padding:2px;gap:2px}
.lang button{appearance:none;border:0;background:none;height:26px;padding:0 9px;border-radius:var(--r1);font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:.06em;color:var(--ink-3);transition:color .2s,background-color .2s}
.lang button:hover{color:var(--ink)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.theme{appearance:none;position:relative;width:32px;height:32px;border:1px solid var(--line-2);border-radius:var(--r2);background:none;color:var(--ink-2);transition:color .2s,border-color .2s,transform .15s}
.theme:hover{color:var(--ink);border-color:var(--ink-3)}
.theme:active{transform:scale(.94)}
.theme svg{position:absolute;inset:0;margin:auto;transition:opacity .35s var(--ease),transform .5s var(--ease)}
.theme .moon{opacity:0;transform:rotate(-60deg) scale(.5)}
[data-theme="dark"] .theme .sun{opacity:0;transform:rotate(60deg) scale(.5)}
[data-theme="dark"] .theme .moon{opacity:1;transform:none}

/* ───────── Hero ───────── */
.hero{padding:clamp(40px,7vw,96px) 0 clamp(36px,5vw,64px)}
.eyebrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.eyebrow b{font-weight:500;color:var(--ink)}
.eyebrow .sep{width:18px;height:1px;background:var(--line-2)}
.signal{display:inline-flex;align-items:center;gap:8px}
.signal::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 color-mix(in srgb,var(--green) 50%,transparent);animation:ping 2.8s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--green) 45%,transparent)}70%,100%{box-shadow:0 0 0 7px transparent}}
h1{font-family:var(--f-serif);font-optical-sizing:auto;font-weight:400;font-size:clamp(40px,6.5vw,94px);line-height:.98;letter-spacing:-.028em;margin:clamp(20px,2.4vw,32px) 0 0;text-wrap:balance}
h1 span{display:block}
h1 em{display:block;font-style:italic;color:var(--blue);letter-spacing:-.02em}
.hero-foot{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,4fr);gap:var(--s6) clamp(32px,8vw,128px);align-items:end;margin-top:clamp(28px,3.4vw,48px)}
.lede{font-size:clamp(16px,1.35vw,19px);line-height:1.5;color:var(--ink-2);max-width:60ch;letter-spacing:-.005em}
.note{border-left:1px solid var(--line-2);padding-left:var(--s4);font-size:12.5px;line-height:1.5;color:var(--ink-3)}
.note .label{display:block;margin-bottom:6px}

/* ───────── Market share ───────── */
.band{padding:clamp(28px,3.4vw,44px) 0;border-top:1px solid var(--line)}
.band-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:var(--s3) var(--s6);margin-bottom:var(--s6)}
.share{position:relative}
.legend{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s4) var(--s5);margin-bottom:var(--s5)}
.lg{appearance:none;display:block;width:100%;text-align:left;border:0;background:none;padding:0;transition:opacity .25s}
.lg-name{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--ink-2);line-height:1.3}
.lg-name i{width:8px;height:8px;flex:none;background:var(--c)}
.lg-val{display:block;margin-top:6px;font-size:clamp(34px,4.6vw,64px);font-weight:500;line-height:1;letter-spacing:-.045em;font-variant-numeric:tabular-nums lining-nums}
.lg-val small{font-size:.42em;font-weight:500;letter-spacing:0;color:var(--ink-3);margin-left:.14em;vertical-align:.52em}
.bar{display:flex;gap:2px;height:36px}
.seg{flex:1 0 0;min-width:3px;background:var(--c);transform-origin:left center;transition:opacity .25s,transform 1s var(--ease);transition-delay:0s,calc(var(--i)*90ms + 120ms);cursor:pointer}
.seg:first-child{border-radius:var(--r1) 0 0 var(--r1)}
.seg:last-child{border-radius:0 var(--r1) var(--r1) 0}
.js .share:not(.in) .seg{transform:scaleX(0)}
.share[data-active] .seg,.share[data-active] .lg{opacity:.28}
.share[data-active="0"] [data-i="0"],.share[data-active="1"] [data-i="1"],.share[data-active="2"] [data-i="2"],.share[data-active="3"] [data-i="3"]{opacity:1}
[data-i="0"]{--c:var(--seg1)}[data-i="1"]{--c:var(--seg2)}[data-i="2"]{--c:var(--seg3)}[data-i="3"]{--c:var(--seg4)}
.scale{display:flex;justify-content:space-between;margin-top:8px;font-family:var(--f-mono);font-size:10px;letter-spacing:.04em;color:var(--ink-4);border-top:1px solid var(--line);padding-top:6px;position:relative}
.scale span{position:relative}
.scale span::before{content:"";position:absolute;top:-7px;left:0;width:1px;height:5px;background:var(--line-2)}
.scale span:last-child::before{left:auto;right:0}
.scale span:nth-child(n+2):nth-last-child(n+2)::before{left:50%}
.tip{position:absolute;z-index:4;left:0;top:0;width:max-content;max-width:min(300px,calc(100% - 8px));padding:10px 12px;background:var(--ink);color:var(--bg);border-radius:var(--r2);font-size:12.5px;line-height:1.4;pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .16s,transform .2s var(--ease)}
.tip.on{opacity:1;transform:none}
.tip b{display:flex;justify-content:space-between;gap:var(--s4);font-weight:600;font-size:13px}
.tip b span{font-family:var(--f-mono);font-weight:500}
.tip p{margin-top:4px;opacity:.72}
.caption{margin-top:var(--s5);font-size:13.5px;color:var(--ink-3);max-width:78ch}

/* ───────── Snapshot ───────── */
.snap{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.snap li{padding:0 var(--s5);border-left:1px solid var(--line)}
.snap li:first-child{padding-left:0;border-left:0}
.snap-v{display:block;font-size:clamp(30px,3.3vw,46px);font-weight:500;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums lining-nums;white-space:nowrap}
.meter{display:block;height:2px;margin:16px 0 14px;background:var(--line);position:relative}
.meter i{position:absolute;inset:0 auto 0 0;width:var(--w);background:var(--blue);transition:width 1.1s var(--ease);transition-delay:calc(var(--i)*70ms + 150ms)}
.meter.est i{background:repeating-linear-gradient(90deg,var(--blue) 0 5px,transparent 5px 8px)}
.js .snap:not(.in) .meter i{width:0}
.snap-n{display:block;font-size:14px;font-weight:600;letter-spacing:-.005em}
.snap-c{display:block;font-size:12.5px;color:var(--ink-3);line-height:1.4;margin-top:2px}
.snap-c::first-letter{text-transform:uppercase}

/* ───────── Market reading ───────── */
.reading{padding:clamp(48px,6vw,88px) 0 clamp(48px,6vw,96px);border-top:1px solid var(--line)}
.rd-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:var(--s7) clamp(32px,6vw,96px);margin-top:var(--s6)}
.ins-n{font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:.08em;color:var(--ink-4);transition:color .25s}
.ins:hover .ins-n{color:var(--blue)}
.ins h3{font-family:var(--f-serif);font-optical-sizing:auto;font-weight:400;letter-spacing:-.018em;text-wrap:balance}
.ins p{color:var(--ink-2)}
.ins-lead{border-top:2px solid var(--ink);padding-top:var(--s4)}
.ins-lead .ins-n{color:var(--blue)}
.ins-lead h3{font-size:clamp(30px,3.5vw,48px);line-height:1.04;margin:var(--s5) 0 var(--s4)}
.ins-lead p{font-size:16px;line-height:1.55;max-width:46ch}
.ins-row{display:grid;grid-template-columns:36px minmax(0,5fr) minmax(0,6fr);gap:var(--s3) var(--s5);padding:var(--s5) 0;border-top:1px solid var(--line-2);align-items:baseline}
.ins-row:last-child{border-bottom:1px solid var(--line)}
.ins-row h3{font-size:clamp(20px,1.75vw,25px);line-height:1.15}
.ins-row p{font-size:14px;line-height:1.55}

/* ───────── Benchmark: command bar ───────── */
.bench-head{padding:clamp(28px,3vw,40px) 0 var(--s5);border-top:1px solid var(--line)}
.cmd{position:sticky;top:0;z-index:6;background:var(--bg);margin:0 -12px;padding:10px 12px 0;border-bottom:1px solid var(--line-2)}
.cmd-row{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2)}
.search{position:relative;flex:1 1 280px;max-width:440px;display:flex;align-items:center;height:36px;border:1px solid var(--line-2);border-radius:var(--r2);background:var(--surface);color:var(--ink-3);transition:border-color .2s,box-shadow .2s,color .2s}
.search:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft);color:var(--blue)}
.search>svg{position:absolute;left:11px;pointer-events:none;transition:transform .3s var(--ease)}
.search:focus-within>svg{transform:scale(1.08)}
.search input{appearance:none;flex:1;min-width:0;height:100%;border:0;background:none;padding:0 34px 0 34px;font-size:13.5px;color:var(--ink);outline:none}
.search input::-webkit-search-cancel-button{display:none}
.search input::placeholder{color:var(--ink-3);opacity:1;transition:opacity .25s,transform .35s var(--ease)}
.search input:focus::placeholder{opacity:.5;transform:translateX(3px)}
.search kbd,.qclear{position:absolute;right:7px;transition:opacity .15s,transform .2s var(--ease)}
.search kbd{font-family:var(--f-mono);font-size:11px;line-height:20px;width:20px;text-align:center;border:1px solid var(--line-2);border-radius:var(--r1);color:var(--ink-3)}
.qclear{appearance:none;width:22px;height:22px;display:grid;place-items:center;border:0;border-radius:var(--r1);background:none;color:var(--ink-3);opacity:0;transform:scale(.7);pointer-events:none}
.qclear:hover{color:var(--ink);background:var(--hover)}
.search.has kbd,.search:focus-within kbd{opacity:0}
.search.has .qclear{opacity:1;transform:none;pointer-events:auto}
.sel{position:relative;color:var(--ink-3)}
.sel select{appearance:none;height:36px;max-width:230px;padding:0 30px 0 12px;border:1px solid var(--line-2);border-radius:var(--r2);background:var(--surface);font-size:13px;color:var(--ink-2);cursor:pointer;text-overflow:ellipsis;transition:border-color .2s,color .2s,box-shadow .2s}
.sel select:hover{border-color:var(--ink-3)}
.sel svg{position:absolute;right:10px;top:50%;margin-top:-5px;pointer-events:none}
.sel.on select{border-color:var(--blue);color:var(--ink);box-shadow:inset 0 0 0 1px var(--blue)}
.sel.on{color:var(--blue)}
.sel-sort{display:none}
.reset{appearance:none;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 10px;border:0;border-radius:var(--r2);background:none;font-size:13px;color:var(--ink-2);opacity:0;transform:translateX(-6px);pointer-events:none;visibility:hidden;transition:opacity .2s,transform .3s var(--ease),visibility 0s .3s,background-color .2s}
.reset.on{opacity:1;transform:none;pointer-events:auto;visibility:visible;transition-delay:0s}
.reset:hover{background:var(--hover);color:var(--ink)}
.reset svg{transition:transform .5s var(--ease)}
.reset:active svg{transform:rotate(-160deg);transition-duration:.1s}
.count{margin-left:auto;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.count b{font-weight:500;color:var(--ink);font-size:13px}
.tabs{display:flex;flex-wrap:wrap;gap:0 2px;margin-top:6px}
.tab{appearance:none;position:relative;display:flex;align-items:baseline;gap:7px;height:38px;padding:0 10px;border:0;background:none;font-size:13px;color:var(--ink-3);white-space:nowrap;transition:color .2s}
.tab:first-child{margin-left:-10px}
.tab em{font-style:normal;font-family:var(--f-mono);font-size:10.5px;color:var(--ink-4);transition:color .2s}
.tab::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .35s var(--ease)}
.tab:hover{color:var(--ink)}
.tab[aria-pressed="true"]{color:var(--ink);font-weight:500}
.tab[aria-pressed="true"] em{color:var(--blue)}
.tab[aria-pressed="true"]::after{transform:scaleX(1)}
.tab:focus-visible{outline-offset:-3px}

/* ───────── Benchmark: table ───────── */
.tbl-wrap{margin:0 -12px}
.tbl{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:13px;line-height:1.45}
.tbl th{position:sticky;top:var(--cmd-h);z-index:3;background:var(--bg);padding:0;text-align:left;font-weight:500;border-bottom:1px solid var(--line-2)}
.tbl th button,.tbl th .nob{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:6px;width:100%;height:38px;padding:0 12px;font-family:var(--f-mono);font-size:10.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.tbl th button{cursor:pointer;transition:color .2s}
.tbl th button:hover{color:var(--ink)}
.tbl th button:focus-visible{outline:2px solid var(--focus);outline-offset:-3px}
.tbl th button span{overflow:hidden;text-overflow:ellipsis}
.arr{opacity:0;transition:opacity .2s,transform .35s var(--ease)}
.tbl th button:hover .arr{opacity:.45}
th[aria-sort="ascending"] button,th[aria-sort="descending"] button{color:var(--ink)}
th[aria-sort="ascending"] .arr,th[aria-sort="descending"] .arr{opacity:1;color:var(--blue)}
th[aria-sort="descending"] .arr{transform:rotate(180deg)}
.c-name{width:20%}.c-status{width:12%}.c-weight{width:9%}.c-creator{width:12%}.c-reg{width:13%}.c-chain{width:11%}.c-vol{width:12%}.c-fund{width:11%}
.tbl td{padding:14px 12px;vertical-align:top;border-bottom:1px solid var(--line);color:var(--ink-2);transition:background-color .18s}
tr.main{cursor:pointer}
tr.main:hover td{background:var(--hover)}
tr.main td.c-name{box-shadow:inset 2px 0 0 transparent;transition:background-color .18s,box-shadow .25s}
tr.main:hover td.c-name{box-shadow:inset 2px 0 0 var(--line-2)}
tr.main.is-open td{background:var(--surface);border-bottom-color:transparent}
tr.main.is-open td.c-name{box-shadow:inset 2px 0 0 var(--blue)}
.rowbtn{all:unset;box-sizing:border-box;display:flex;align-items:flex-start;gap:8px;cursor:pointer;font-size:14.5px;font-weight:600;line-height:1.3;letter-spacing:-.01em;color:var(--ink);max-width:100%}
.rowbtn:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:var(--r1)}
.rowbtn svg{margin-top:4px;color:var(--ink-4);transition:transform .35s var(--ease),color .2s}
tr.main:hover .rowbtn svg{color:var(--ink)}
tr.main.is-open .rowbtn svg{transform:rotate(90deg);color:var(--blue)}
.cattag{display:block;margin:3px 0 0 20px;font-size:12px;color:var(--ink-3);line-height:1.35}
.clamp{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden}
.st{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--ink);white-space:nowrap}
.st i{width:8px;height:8px;border-radius:50%;flex:none;border:1.5px solid var(--sc);background:var(--sc)}
.st-live{--sc:var(--green)}
.st-partial{--sc:var(--amber)}
.st-partial i{background:linear-gradient(90deg,var(--sc) 50%,transparent 50%)}
.st-pending{--sc:var(--blue)}
.st-pending i{background:transparent}
.st-announced{--sc:var(--blue)}
.st-rumor{--sc:var(--ink-3)}
.st-rumor i{background:transparent;border-style:dashed;border-width:1px}
.st-closed{--sc:var(--ink-4);color:var(--ink-3)}
.st-closed i{border-radius:1px}
.snote{margin:4px 0 0 16px;font-size:12px;line-height:1.4;color:var(--ink-3)}
.units{display:flex;gap:2px;margin:4px 0 6px}
.units i{width:5px;height:12px;border-radius:1px;background:var(--line-2)}
.units i.on{background:var(--ink)}
.wlabel{font-size:12px;color:var(--ink-3)}
.rtag{display:block;font-family:var(--f-mono);font-size:10.5px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--ink);margin-bottom:3px}
.rtag+.clamp{font-size:12.5px;color:var(--ink-3)}
.figs{color:var(--ink-3);font-variant-numeric:tabular-nums lining-nums}
.figs b{font-weight:600;color:var(--ink)}
.nd{color:var(--ink-4)}
tbody.swap tr.main{animation:rowIn .32s var(--ease) both}
tbody.intro .units i{animation:unitIn .5s var(--ease) both;animation-delay:calc(var(--i)*45ms + 200ms)}
@keyframes rowIn{from{opacity:0;transform:translateY(4px)}}
@keyframes unitIn{from{transform:scaleY(.25);opacity:.2}}
.units i{transform-origin:bottom}

/* Insight panel */
tr.detail td{padding:0;border-bottom:1px solid var(--line-2);background:var(--surface);box-shadow:inset 2px 0 0 var(--blue)}
.dwrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .42s var(--ease)}
.dwrap.open{grid-template-rows:1fr}
.dinner{min-height:0;overflow:hidden}
.dgrid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:var(--s6) clamp(32px,5vw,80px);padding:6px 12px 30px 32px;opacity:0;transform:translateY(-6px);transition:opacity .3s,transform .45s var(--ease)}
.dwrap.open .dgrid{opacity:1;transform:none;transition-delay:.08s}
.d-lead{font-family:var(--f-serif);font-optical-sizing:auto;font-size:clamp(19px,1.6vw,22px);line-height:1.32;letter-spacing:-.012em;color:var(--ink);margin-top:8px;text-wrap:pretty}
.d-ctx{margin-top:var(--s5)}
.d-ctx p{margin-top:6px;font-size:13.5px;line-height:1.55;color:var(--ink-2);max-width:60ch}
.visit{display:inline-flex;align-items:center;gap:8px;margin-top:var(--s5);height:34px;padding:0 12px 0 10px;border:1px solid var(--line-2);border-radius:var(--r2);font-size:13px;font-weight:500;color:var(--ink);transition:border-color .2s,background-color .2s,color .2s}
.visit svg{color:var(--blue);transition:transform .3s var(--ease),color .2s}
.visit:hover{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.visit:hover svg{transform:translate(2px,-2px);color:currentColor}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 var(--s6);align-content:start}
.facts div{padding:10px 0 12px;border-top:1px solid var(--line)}
.facts dd{margin-top:4px;font-size:13px;line-height:1.5;color:var(--ink-2)}
.facts dd .st{font-size:13px}
.facts dd .snote{margin-left:0}

.empty{padding:72px 16px;text-align:center;color:var(--ink-3)}
.empty svg{margin:0 auto 14px;color:var(--ink-4)}
.empty p{font-size:15px;color:var(--ink-2)}
.empty button{appearance:none;margin-top:14px;height:34px;padding:0 14px;border:1px solid var(--line-2);border-radius:var(--r2);background:none;font-size:13px;font-weight:500;transition:background-color .2s,color .2s,border-color .2s}
.empty button:hover{background:var(--ink);border-color:var(--ink);color:var(--bg)}
tr.none td{border-bottom:0}
tr.none:hover td{background:none}

/* ───────── Methodology & sources ───────── */
.method{margin-top:clamp(64px,8vw,120px);padding:clamp(40px,5vw,72px) 0 0;border-top:2px solid var(--ink)}
.m-title{font-family:var(--f-serif);font-optical-sizing:auto;font-weight:400;font-size:clamp(28px,3.2vw,44px);line-height:1.05;letter-spacing:-.02em;margin-top:var(--s4)}
.m-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:var(--s7) clamp(32px,6vw,96px);margin-top:var(--s7)}
.m-text p{font-size:15px;line-height:1.6;color:var(--ink-2);max-width:54ch}
.m-text p+p{margin-top:var(--s4)}
.keys{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s5) var(--s6);margin-top:var(--s6);padding-top:var(--s5);border-top:1px solid var(--line)}
.keys ul{margin-top:var(--s3);display:grid;gap:9px}
.keys li{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--ink-2)}
.keys .units{margin:0}
.src-list{margin-top:var(--s3);columns:2;column-gap:var(--s6)}
.src-list li{break-inside:avoid;border-top:1px solid var(--line)}
.src-list a{display:grid;grid-template-columns:22px minmax(0,1fr) 14px;gap:0 10px;align-items:start;padding:11px 0 12px;transition:color .2s}
.src-i{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;color:var(--ink-4);line-height:20px}
.src-p{display:block;font-size:14px;font-weight:600;line-height:20px;letter-spacing:-.005em}
.src-d{display:block;font-size:13px;line-height:1.45;color:var(--ink-3)}
.src-h{display:block;margin-top:2px;font-family:var(--f-mono);font-size:10.5px;color:var(--ink-4)}
.src-list svg{margin-top:5px;color:var(--ink-4);transition:transform .3s var(--ease),color .2s}
.src-list a:hover .src-p{color:var(--blue)}
.src-list a:hover svg{transform:translate(2px,-2px);color:var(--blue)}
.colophon{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:var(--s3) var(--s5);margin-top:clamp(48px,6vw,88px);padding:var(--s5) 0 var(--s7);border-top:1px solid var(--line);font-family:var(--f-mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.colophon .brand{font-family:var(--f-sans);font-size:13px;letter-spacing:-.005em;text-transform:none;color:var(--ink)}

/* ───────── Motion ───────── */
.js [data-reveal]{opacity:0;transform:translateY(14px);transition:opacity .7s var(--ease),transform .9s var(--ease);transition-delay:var(--d,0ms)}
.js [data-reveal].in{opacity:1;transform:none}
::view-transition-old(root),::view-transition-new(root){animation-duration:.3s;animation-timing-function:ease}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .js [data-reveal]{opacity:1;transform:none}
  .js .share:not(.in) .seg{transform:none}
  .js .snap:not(.in) .meter i{width:var(--w)}
  ::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}
}

/* ───────── Responsive ───────── */
@media (max-width:1279px){
  .c-creator{display:none}
  .c-name{width:23%}.c-status{width:14%}.c-weight{width:10%}.c-reg{width:14%}.c-chain{width:13%}.c-vol{width:13%}.c-fund{width:13%}
}
@media (max-width:1099px){
  .c-fund{display:none}
  .c-name{width:26%}.c-status{width:16%}.c-weight{width:12%}.c-reg{width:16%}.c-chain{width:14%}.c-vol{width:16%}
  .snap{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:var(--s6)}
  .snap li:nth-child(4){padding-left:0;border-left:0}
  .rd-grid,.m-grid{grid-template-columns:1fr}
  .ins-lead p{max-width:62ch}
  .tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 90%,transparent);mask-image:linear-gradient(90deg,#000 90%,transparent)}
  .tabs::-webkit-scrollbar{display:none}
  .tab:last-child{margin-right:48px}
}
@media (max-width:899px){
  .c-chain{display:none}
  .c-name{width:30%}.c-status{width:17%}.c-weight{width:13%}.c-reg{width:20%}.c-vol{width:20%}
  .hero-foot{grid-template-columns:1fr}
  .dgrid{grid-template-columns:1fr;gap:var(--s5)}
  .legend{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:719px){
  .topbar{height:56px}
  .brand{font-size:13px}
  .eyebrow .sep{display:none}
  .snap{grid-template-columns:repeat(2,minmax(0,1fr))}
  .snap li,.snap li:nth-child(4){padding:0 var(--s4);border-left:1px solid var(--line)}
  .snap li:nth-child(odd){padding-left:0;border-left:0}
  .ins-row{grid-template-columns:36px minmax(0,1fr)}
  .ins-row p{grid-column:2}
  .cmd{position:static;border-bottom:1px solid var(--line-2)}
  .search{flex-basis:100%;max-width:none;height:42px}
  .search input{font-size:16px}
  .search kbd{display:none}
  .sel{flex:1 1 0;min-width:0}
  .sel select{width:100%;max-width:none;height:40px}
  .sel-sort{display:block;flex-basis:100%}
  .reset{height:40px}
  .count{flex:1;text-align:right}
  .tabs{margin-top:8px}
  .tab{height:42px}
  .tbl,.tbl tbody{display:block}
  .tbl thead{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
  tr.main{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px var(--s4);padding:16px 12px;border-bottom:1px solid var(--line);box-shadow:inset 2px 0 0 transparent;transition:background-color .18s,box-shadow .25s}
  .tbl tr.main td{display:block;width:auto;padding:0;border:0;background:none!important;box-shadow:none!important}
  tr.main:hover{background:var(--hover)}
  tr.main.is-open{background:var(--surface);border-bottom-color:transparent;box-shadow:inset 2px 0 0 var(--blue)}
  .tbl tr.main td.c-creator,.tbl tr.main td.c-reg,.tbl tr.main td.c-chain,.tbl tr.main td.c-fund{display:none}
  td.c-name{grid-column:1;grid-row:1}
  td.c-weight{grid-column:2;grid-row:1;display:flex!important;flex-direction:column;align-items:flex-end;text-align:right}
  td.c-weight .units{margin:3px 0 5px}
  td.c-status{grid-column:1/-1;padding-left:20px!important;display:flex!important;flex-wrap:wrap;align-items:baseline;gap:2px 12px}
  td.c-status .snote{margin:0}
  td.c-vol{grid-column:1/-1;padding-left:20px!important}
  td.c-vol .nd{display:none}
  .rowbtn{font-size:16px}
  tr.detail,tr.detail td{display:block}
  .dgrid{padding:2px 12px 26px 32px}
  .facts{grid-template-columns:1fr}
  tr.none,tr.none td{display:block}
  .keys{grid-template-columns:1fr}
  .src-list{columns:1}
}
@media (max-width:420px){
  .lang button{padding:0 7px}
  .lg-name{font-size:12.5px}
}
</style>
</head>
<body>
<div class="page">
<div class="wrap">

<div class="topbar">

  <div class="tools">
    <div class="lang" id="lang" role="group">
      <button type="button" data-l="en" lang="en" aria-label="English">EN</button>
      <button type="button" data-l="fr" lang="fr" aria-label="Français">FR</button>

    <button type="button" class="theme" id="theme">
      <svg class="sun" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="2.9"/><path d="M8 1.2v1.6M8 13.2v1.6M1.2 8h1.6M13.2 8h1.6M3.2 3.2l1.1 1.1M11.7 11.7l1.1 1.1M3.2 12.8l1.1-1.1M11.7 4.3l1.1-1.1"/></svg>
      <svg class="moon" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M13.6 9.6A6 6 0 0 1 6.4 2.4a6 6 0 1 0 7.2 7.2Z"/></svg>
    </button>
  </div>
</div>

<header class="hero">
  <p class="eyebrow" data-reveal>
    <b data-i18n="issue"></b><i class="sep" aria-hidden="true"></i>

    <span data-i18n="updated"></span>

  <h1 data-reveal style="--d:60ms"><span data-i18n="h1a"></span><em data-i18n="h1b"></em></h1>

</header>

<section class="band" aria-labelledby="shareTitle" data-reveal style="--d:200ms">
  <div class="band-head">
    <div>
      <p class="kicker" data-i18n="shareKicker"></p>
      <h2 class="sec-title" id="shareTitle" data-i18n="shareTitle"></h2>
    </div>
  </div>
  <div class="share" id="share">
    <ul class="legend" id="legend"></ul>
    <div class="bar" id="bar" role="img"></div>
    <div class="scale num" aria-hidden="true"><span>0</span><span>25</span><span>50</span><span>75</span><span>100</span></div>
    <div class="tip" id="tip" aria-hidden="true"></div>
  </div>
  <p class="caption" data-i18n="caption"></p>
</section>

<section class="band" aria-labelledby="snapTitle" data-reveal>
  <div class="band-head">
    <div>
      <p class="kicker g" data-i18n="snapKicker"></p>
      <h2 class="sec-title" id="snapTitle" data-i18n="valosLabel"></h2>

  </div>
  <ul class="snap" id="valos"></ul>
</section>

<section class="reading" aria-labelledby="readingTitle">

</section>

<main class="bench" id="bench">
  <div class="bench-head">
    <p class="kicker g" data-i18n="benchKicker"></p>
    <h2 class="sec-title" id="benchTitle"></h2>
  </div>

  <div class="cmd" id="cmd">
    <div class="cmd-row">
      <div class="search" id="searchbox">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="6" cy="6" r="4.3"/><path d="m9.3 9.3 3.2 3.2"/></svg>
        <input id="q" type="search" autocomplete="off" spellcheck="false" enterkeyhint="search">
        <kbd aria-hidden="true">/</kbd>
        <button type="button" class="qclear" id="qclear" tabindex="-1"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="m1.5 1.5 7 7M8.5 1.5l-7 7"/></svg></button>
      </div>
      <div class="sel"><select id="fstatus"></select><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m2 3.5 3 3 3-3"/></svg></div>
      <div class="sel"><select id="freg"></select><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m2 3.5 3 3 3-3"/></svg></div>
      <div class="sel sel-sort"><select id="fsort"></select><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m2 3.5 3 3 3-3"/></svg></div>
      <button class="reset" id="reset" type="button"><svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.2 7a4.8 4.8 0 1 0 1.5-3.5"/><path d="M2 1.8v2.4h2.4"/></svg><span data-i18n="reset"></span></button>
      <p class="count"><span id="countv" aria-hidden="true"></span><span class="sr" id="count" aria-live="polite"></span></p>
    </div>
    <div class="tabs" id="cats" role="group"></div>
  </div>

  <div class="tbl-wrap">
  <table class="tbl" id="tbl" aria-labelledby="benchTitle">
    <thead>
      <tr>
        <th class="c-name" data-k="name" scope="col"><button type="button"><span data-i18n="thName"></span><svg class="arr" width="8" height="10" viewBox="0 0 8 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V1M1 4l3-3 3 3"/></svg></button></th>
        <th class="c-status" data-k="status" scope="col"><button type="button"><span data-i18n="thStatus"></span><svg class="arr" width="8" height="10" viewBox="0 0 8 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V1M1 4l3-3 3 3"/></svg></button></th>

        <th class="c-fund" scope="col"><span class="nob" data-i18n="thFundShort"></span></th>

    <tbody id="tb" class="intro"></tbody>

  </div>
</main>

<footer class="method" aria-labelledby="methodTitle">

</footer>

<script>
const I18N = {
 en:{
  title:"Prediction markets benchmark — October 2026",

  valosLabel:"Latest known valuations",

const FIELDS = ["n","cr","d","r","ch","m","v","f","x","sn"];
const REDUCED = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = id => document.getElementById(id);

function getLang(){
  try{ const p = new URLSearchParams(location.search).get("lang"); if(p==="fr"||p==="en") return p; }catch(e){}
  try{ const s = localStorage.getItem("pm-bench-lang"); if(s==="fr"||s==="en") return s; }catch(e){}
  return "en";
}
const state = {lang:getLang(), cat:"", status:"", reg:"", q:"", sortK:"weight", sortDir:-1, open:new Set()};
const T = () => I18N[state.lang];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const ID = r => norm(r.n).replace(/[^a-z0-9]+/g,"-");
const BYID = {}; D.forEach(r => BYID[ID(r)] = r);
function L(r,k){
  if(state.lang==="fr") return r[k];
  const e = EN[r.n] || {};
  if(e[k] !== undefined) return e[k];
  return GEN[r[k]] ?? r[k];
}

/* Cross-fade a state change when the browser can, otherwise apply it directly */
function swap(fn){
  if(REDUCED || !document.startViewTransition) return fn();
  const vt = document.startViewTransition(fn), quiet = () => {};
  vt.ready.catch(quiet); vt.finished.catch(quiet);
}

/* ───────── Cell renderers ───────── */
const BLANK = new Set(["n.d.","n/a","—",""]);
const cell = v => BLANK.has(v ?? "") ? `<span class="nd">${esc(v||"—")}</span>` : esc(v);
const figs = v => BLANK.has(v ?? "") ? `<span class="nd">${esc(v||"—")}</span>` : esc(v).replace(FIG[state.lang], m => `<b>${m}</b>`);
const statusMark = s => `<span class="st st-${s}"><i></i>${esc(T().status[s])}</span>`;
const units = w => `<span class="units" aria-hidden="true">${[1,2,3,4,5].map(i => `<i class="${i<=w?"on":""}" style="--i:${i}"></i>`).join("")}</span>`;

/* ───────── Static content ───────── */
function applyStatic(){
  const t = T();
  document.documentElement.lang = state.lang;
  document.title = t.title;
  document.querySelectorAll("[data-i18n]").forEach(el => { const v = t[el.dataset.i18n]; if(typeof v === "string") el.textContent = v; });
  $("lang").setAttribute("aria-label", t.langLabel);
  $("lang").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l===state.lang));
  syncThemeLabel();
  $("tracked").textContent = t.tracked(D.length);
  $("benchTitle").textContent = t.benchTitle(D.length, Object.keys(t.cats).length);

  // Market share
  const pct = [...t.pct, t.novig.replace(/^Novig\s*/,"")];
  $("bar").setAttribute("aria-label", t.barLabel);
  $("bar").innerHTML = SHARE.map((s,i) => `<span class="seg" data-i="${i}" style="flex-grow:${s.p};--i:${i}"></span>`).join("");
  $("legend").innerHTML = SHARE.map((s,i) => {
    const m = pct[i].match(/^([\d.,]+)(\s*%)$/) || [0,pct[i],""];
    return `<li><button type="button" class="lg" data-i="${i}" aria-label="${esc(s.l)} ${esc(pct[i])} — ${esc(t.viewRow)}">
      <span class="lg-name"><i></i>${esc(s.l)}</span><span class="lg-val">${esc(m[1])}<small>%</small></span></button></li>`;
  }).join("");
  SHARE.forEach((s,i) => s.pct = pct[i]);

  // Snapshot
  $("valos").innerHTML = t.valos.map(([b,s],i) => {
    const cut = s.indexOf(", "), name = cut<0 ? s : s.slice(0,cut), ctx = cut<0 ? "" : s.slice(cut+2);
    return `<li><span class="snap-v">${esc(b)}</span>
      <span class="meter${b.startsWith("~")?" est":""}" aria-hidden="true"><i style="--w:${(VALO_SCALE[i]/VALO_SCALE[0]*100).toFixed(1)}%;--i:${i}"></i></span>
      <span class="snap-n">${esc(name)}</span><span class="snap-c">${esc(ctx)}</span></li>`;
  }).join("");

  // Market reading
  const ins = (h,p,i,cls) => `<article class="ins ${cls}" data-reveal style="--d:${i*70}ms"><span class="ins-n">0${i+1}</span><h3>${esc(h)}</h3><p>${esc(p)}</p></article>`;
  $("reading").innerHTML = ins(t.reading[0][0], t.reading[0][1], 0, "ins-lead") +
    `<div>${t.reading.slice(1).map(([h,p],i) => ins(h,p,i+1,"ins-row")).join("")}</div>`;

  // Command bar
  const q = $("q"); q.placeholder = t.search; q.setAttribute("aria-label", t.searchLabel);
  $("qclear").setAttribute("aria-label", t.clearSearch);
  const opts = (all,o) => `<option value="">${esc(all)}</option>` + Object.entries(o).map(([k,v]) => `<option value="${k}">${esc(v)}</option>`).join("");
  const fs = $("fstatus"); fs.setAttribute("aria-label", t.statusLabel); fs.innerHTML = opts(t.statusAll, t.statusOpts); fs.value = state.status;
  const fr = $("freg"); fr.setAttribute("aria-label", t.regLabel); fr.innerHTML = opts(t.regAll, t.regOpts); fr.value = state.reg;
  const so = $("fsort"); so.setAttribute("aria-label", t.sortLabel);
  so.innerHTML = SORT_KEYS.map(([k,l]) => `<option value="${k}">${esc(t.sortPrefix + t[l])}</option>`).join(""); so.value = state.sortK;

  // Methodology
  $("legendweight").innerHTML = [5,4,3,2,1].map(w => `<li>${units(w)}${esc(t.weight[w])}</li>`).join("");
  $("legendstatus").innerHTML = Object.keys(t.status).map(k => `<li>${statusMark(k)}</li>`).join("");
  $("sources").innerHTML = t.sources.map((s,i) => {
    const cut = s.indexOf(" — "), pub = cut<0 ? s : s.slice(0,cut), desc = cut<0 ? "" : s.slice(cut+3);
    let host = ""; try{ host = new URL(SOURCE_URLS[i]).hostname.replace(/^www\./,""); }catch(e){}
    return `<li><a href="${SOURCE_URLS[i]}" target="_blank" rel="noopener"><span class="src-i">${String(i+1).padStart(2,"0")}</span>
      <span><span class="src-p">${esc(pub)}</span><span class="src-d">${esc(desc)}</span><span class="src-h">${esc(host)}</span></span>${ICON.out}</a></li>`;
  }).join("");
  observe();
}

function renderCats(){
  const t = T(), box = $("cats"), counts = {};
  box.setAttribute("aria-label", t.catsLabel);
  D.forEach(r => counts[r.c] = (counts[r.c]||0)+1);
  const items = [["", t.all, D.length], ...Object.entries(t.cats).map(([k,v]) => [k, v, counts[k]||0])];
  box.innerHTML = items.map(([k,l,n]) => `<button type="button" class="tab" data-c="${k}" aria-pressed="${state.cat===k}">${esc(l)} <em>${n}</em></button>`).join("");
}
function syncCats(){
  $("cats").querySelectorAll(".tab").forEach(b => b.setAttribute("aria-pressed", b.dataset.c===state.cat));
}

/* ───────── Table ───────── */
function val(r,k){
  if(k==="status") return STATUS_META[r.s][1];
  if(k==="weight") return r.w;
  const map = {name:"n",creator:"cr",reg:"r",chain:"ch"};
  return norm(L(r,map[k]));
}

function detailHTML(r, open){
  const t = T(), id = ID(r), name = L(r,"n"), sn = L(r,"sn"), x = L(r,"x");
  const fact = (label, html) => `<div><dt class="label">${esc(label)}</dt><dd>${html}</dd></div>`;
  return `<tr class="detail" id="d-${id}"><td colspan="8"><div class="dwrap${open?" open":""}"><div class="dinner"><div class="dgrid">
    <div>
      <p class="label">${esc(t.thDiff)}</p>
      <p class="d-lead">${esc(L(r,"d"))}</p>
      <div class="d-ctx"><p class="label">${esc(t.context)}</p><p>${x?esc(x):esc(t.noMore)}</p></div>
      ${r.u?`<a class="visit" href="${esc(r.u)}" target="_blank" rel="noopener">${ICON.out}${esc(t.open(name))}</a>`:""}
    </div>
    <dl class="facts">
      ${fact(t.thStatus, statusMark(r.s) + (sn?`<span class="snote" style="display:block">${esc(sn)}</span>`:""))}
      ${fact(t.thCreator, esc(L(r,"cr")))}
      ${fact(t.thReg, esc(L(r,"r")))}
      ${fact(t.thChain, cell(L(r,"ch")))}
      ${fact(t.thModel, cell(L(r,"m")))}
      ${fact(t.thVol, figs(L(r,"v")))}
      ${fact(t.thFund, figs(L(r,"f")))}
    </dl>
  </div></div></div></td></tr>`;
}

function render(animate){
  const t = T(), q = norm(state.q);
  let rows = D.filter(r =>
    (!state.cat || r.c===state.cat) && (!state.status || r.s===state.status) && (!state.reg || r.rg===state.reg) &&
    (!q || norm(FIELDS.map(k => L(r,k)).concat([t.cats[r.c], r.n]).join(" ")).includes(q))
  );
  rows.sort((a,b) => {
    const va = val(a,state.sortK), vb = val(b,state.sortK);
    if(va<vb) return -1*state.sortDir; if(va>vb) return state.sortDir;
    return b.w - a.w || norm(a.n).localeCompare(norm(b.n));
  });
  document.querySelectorAll("thead th[data-k]").forEach(th => {
    const on = th.dataset.k===state.sortK;
    th.setAttribute("aria-sort", on ? (state.sortDir===1?"ascending":"descending") : "none");
  });
  $("fsort").value = state.sortK;
  $("count").textContent = t.count(rows.length, D.length);
  $("countv").innerHTML = `<b>${rows.length}</b> / ${D.length} ${esc(t.unit)}`;
  $("fstatus").parentElement.classList.toggle("on", !!state.status);
  $("freg").parentElement.classList.toggle("on", !!state.reg);
  $("searchbox").classList.toggle("has", !!state.q);
  $("reset").classList.toggle("on", !!(state.cat || state.status || state.reg || state.q));

  const tb = $("tb");
  if(animate && !REDUCED){ tb.classList.remove("swap"); void tb.offsetWidth; tb.classList.add("swap"); }
  if(!rows.length){
    tb.innerHTML = `<tr class="none"><td colspan="8"><div class="empty">${ICON.none}<p>${esc(t.empty)}</p><button type="button" id="clr">${esc(t.clear)}</button></div></td></tr>`;
    $("clr").addEventListener("click", resetAll);
    return;
  }
  tb.innerHTML = rows.map(r => {
    const id = ID(r), open = state.open.has(id), sn = L(r,"sn"), tag = t.regTag[r.rg];
    return `<tr class="main${open?" is-open":""}" data-id="${id}">
      <td class="c-name"><button type="button" class="rowbtn" aria-expanded="${open}" aria-controls="d-${id}">${ICON.chev}<span>${esc(L(r,"n"))}</span></button><span class="cattag">${esc(t.cats[r.c])}</span></td>
      <td class="c-status">${statusMark(r.s)}${sn?`<span class="snote clamp">${esc(sn)}</span>`:""}</td>
      <td class="c-weight">${units(r.w)}<span class="wlabel">${esc(t.weight[r.w])}</span></td>
      <td class="c-creator"><span class="clamp">${esc(L(r,"cr"))}</span></td>
      <td class="c-reg">${tag?`<span class="rtag">${esc(tag)}</span>`:""}<span class="clamp">${esc(L(r,"r"))}</span></td>
      <td class="c-chain"><span class="clamp">${cell(L(r,"ch"))}</span></td>
      <td class="c-vol"><span class="clamp figs">${figs(L(r,"v"))}</span></td>
      <td class="c-fund"><span class="clamp figs">${figs(L(r,"f"))}</span></td>
    </tr>` + (open ? detailHTML(r,true) : "");
  }).join("");
}

function toggle(tr){
  const id = tr.dataset.id, r = BYID[id], btn = tr.querySelector(".rowbtn");
  let d = $("d-"+id);
  if(state.open.has(id)){
    state.open.delete(id); tr.classList.remove("is-open"); btn.setAttribute("aria-expanded","false");
    if(!d) return;
    const w = d.querySelector(".dwrap"), done = () => d.remove();
    if(REDUCED) return done();
    w.classList.remove("open");
    w.addEventListener("transitionend", e => { if(e.target===w) done(); });
    setTimeout(done, 520);
  } else {
    state.open.add(id); tr.classList.add("is-open"); btn.setAttribute("aria-expanded","true");
    if(d) d.remove();
    tr.insertAdjacentHTML("afterend", detailHTML(r, REDUCED));
    if(REDUCED) return;
    const w = tr.nextElementSibling.querySelector(".dwrap");
    void w.offsetHeight; w.classList.add("open");
  }
}

function jumpTo(name){
  const r = D.find(x => x.n===name); if(!r) return;
  const id = ID(r);
  state.cat=""; state.status=""; state.reg=""; state.q=""; $("q").value="";
  $("fstatus").value=""; $("freg").value="";
  state.open.add(id); syncCats(); render();
  const tr = $("tb").querySelector(`tr[data-id="${id}"]`); if(!tr) return;
  tr.scrollIntoView({block:"center", behavior: REDUCED ? "auto" : "smooth"});
  tr.querySelector(".rowbtn").focus({preventScroll:true});
}

function setSort(k){
  if(state.sortK===k) state.sortDir *= -1; else { state.sortK=k; state.sortDir = (k==="weight") ? -1 : 1; }
  render(true);
}
function resetAll(){
  state.cat=""; state.status=""; state.reg=""; state.q="";
  $("q").value=""; $("fstatus").value=""; $("freg").value="";
  syncCats(); render(true);
}
function setLang(l){
  if(l===state.lang) return;
  swap(() => {
    state.lang = l;
    try{ localStorage.setItem("pm-bench-lang", l); }catch(e){}
    applyStatic(); renderCats(); render();
  });
}

/* ───────── Theme ───────── */
const root = document.documentElement;
function syncThemeLabel(){
  const t = T(), label = root.dataset.theme==="dark" ? t.themeLight : t.themeDark;
  $("theme").setAttribute("aria-label", label); $("theme").title = label;
}
$("theme").addEventListener("click", () => {
  const next = root.dataset.theme==="dark" ? "light" : "dark";
  swap(() => { root.dataset.theme = next; syncThemeLabel(); });
  try{ localStorage.setItem("pm-bench-theme", next); }catch(e){}
});
if(window.matchMedia){
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", e => {
    let saved; try{ saved = localStorage.getItem("pm-bench-theme"); }catch(err){}
    if(saved!=="light" && saved!=="dark"){ root.dataset.theme = e.matches ? "dark" : "light"; syncThemeLabel(); }
  });
}

/* ───────── Market share interactions ───────── */
(function(){
  const share = $("share"), tip = $("tip");
  function show(i){
    const s = SHARE[i], row = D.find(x => x.n===s.n), seg = share.querySelector(`.seg[data-i="${i}"]`);
    if(!seg) return;
    share.dataset.active = i;
    tip.innerHTML = `<b>${esc(s.l)}<span>${esc(s.pct)}</span></b>${row?`<p>${esc(L(row,"v"))}</p>`:""}`;
    const b = share.getBoundingClientRect(), g = seg.getBoundingClientRect();
    const x = Math.max(4, Math.min(g.left - b.left + g.width/2 - tip.offsetWidth/2, b.width - tip.offsetWidth - 4));
    tip.style.left = x + "px"; tip.style.top = (g.top - b.top - tip.offsetHeight - 10) + "px";
    tip.classList.add("on");
  }
  function hide(){ delete share.dataset.active; tip.classList.remove("on"); }
  const hit = e => e.target.closest(".seg,.lg");
  share.addEventListener("mouseover", e => { const el = hit(e); if(el) show(+el.dataset.i); });
  share.addEventListener("mouseout", e => { if(hit(e) && !(e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest(".seg,.lg"))) hide(); });
  share.addEventListener("focusin", e => { const el = hit(e); if(el) show(+el.dataset.i); });
  share.addEventListener("focusout", hide);
  share.addEventListener("click", e => { const el = hit(e); if(el){ hide(); jumpTo(SHARE[+el.dataset.i].n); } });
})();

/* ───────── Reveal on scroll ───────── */
let io = null;
function observe(){
  const els = document.querySelectorAll("[data-reveal]:not(.in), .share:not(.in), .snap:not(.in)");
  if(REDUCED || !("IntersectionObserver" in window)){ els.forEach(el => el.classList.add("in")); return; }
  if(!io) io = new IntersectionObserver(entries => entries.forEach(en => {
    if(en.isIntersecting){ en.target.classList.add("in"); io.unobserve(en.target); }
  }), {rootMargin:"0px 0px -6% 0px"});
  els.forEach(el => io.observe(el));
}

/* ───────── Events ───────── */
document.querySelectorAll("thead th[data-k] button").forEach(b => b.addEventListener("click", () => setSort(b.parentElement.dataset.k)));
$("fsort").addEventListener("change", e => { state.sortK = e.target.value; state.sortDir = (state.sortK==="weight") ? -1 : 1; render(true); });
$("lang").addEventListener("click", e => { const b = e.target.closest("button[data-l]"); if(b) setLang(b.dataset.l); });
$("cats").addEventListener("click", e => { const b = e.target.closest(".tab"); if(!b) return; state.cat = b.dataset.c; syncCats(); render(true); });
$("q").addEventListener("input", e => { state.q = e.target.value; render(); });
$("q").addEventListener("keydown", e => { if(e.key==="Escape"){ if(state.q){ e.target.value=""; state.q=""; render(); } else e.target.blur(); } });
$("qclear").addEventListener("click", () => { $("q").value=""; state.q=""; render(); $("q").focus(); });
$("fstatus").addEventListener("change", e => { state.status = e.target.value; render(true); });
$("freg").addEventListener("change", e => { state.reg = e.target.value; render(true); });
$("reset").addEventListener("click", resetAll);
$("tb").addEventListener("click", e => {
  if(e.target.closest("a")) return;
  const tr = e.target.closest("tr.main"); if(tr) toggle(tr);
});
$("tb").addEventListener("animationend", e => { if(e.target.closest("tr.main") && e.animationName==="rowIn") $("tb").classList.remove("swap"); });
document.addEventListener("keydown", e => {
  if(e.key!=="/" || e.ctrlKey || e.metaKey || e.altKey) return;
  const a = document.activeElement;
  if(a && (a.tagName==="INPUT" || a.tagName==="SELECT" || a.tagName==="TEXTAREA" || a.isContentEditable)) return;
  e.preventDefault(); $("q").focus(); $("q").select();
});

/* Sticky table header sits right under the command bar, whatever its height */
(function(){
  const cmd = $("cmd"), set = () => root.style.setProperty("--cmd-h", (getComputedStyle(cmd).position==="sticky" ? cmd.offsetHeight : 0) + "px");
  if("ResizeObserver" in window) new ResizeObserver(set).observe(cmd);
  window.addEventListener("resize", set); set();
})();

applyStatic(); renderCats(); render();
setTimeout(() => $("tb").classList.remove("intro"), 1600);
</script>
</body>
</html>
